{% extends "base.html" %}
{% block title %}Downloads | {{ site.hospital_name|default:"Hospital" }}{% endblock %}
{% block content %}
<section class="page-head"><div class="container"><h1>Downloads</h1></div></section>
<section class="section">
  <div class="container narrow">
    {% for item in items %}
    <div class="card download">
      <div>
        <h3>{{ item.title }}</h3>
        <p class="muted">{{ item.description }}</p>
      </div>
      <a class="btn" href="{{ item.file.url }}" download>Download</a>
    </div>
    {% empty %}
    <p class="center muted">No documents available yet.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
